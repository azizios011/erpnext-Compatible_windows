# DISABLED: Workflow disabled in fork to prevent CI runs on upstream PRs
name: 'Lock threads'

on:
  workflow_dispatch:
    inputs:
      disabled:
        type: boolean
        default: true

permissions:
  issues: write
  pull-requests: write


jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v5
        with:
          github-token: ${{ github.token }}
          issue-inactive-days: 14
          pr-inactive-days: 14
